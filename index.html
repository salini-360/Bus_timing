<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Timing App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f6fa;
    color: #222;
    padding-bottom: 100px;
}

header {
    background: #1d3557;
    color: white;
    padding: 25px 20px;
    border-radius: 0 0 25px 25px;
}

header h1 {
    font-size: 25px;
    margin-bottom: 8px;
}

header p {
    font-size: 14px;
    opacity: 0.8;
}

.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

/* TOWN BUTTONS */

.section-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.section-btn {
    padding: 15px 5px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #1d3557;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}

.section-btn.active {
    background: #1d3557;
    color: white;
}

/* HEADING */

.time-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.time-heading h2 {
    font-size: 20px;
}

.time-heading span {
    font-size: 12px;
    color: #666;
}

/* BUS CARD */

.bus-card {
    background: white;
    padding: 18px;
    margin-bottom: 14px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.04);
}

.bus-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.bus-time {
    font-size: 22px;
    font-weight: bold;
    color: #1d3557;
}

.bus-name {
    font-size: 16px;
    font-weight: bold;
    margin-top: 8px;
}

.bus-route {
    font-size: 14px;
    color: #777;
    margin-top: 6px;
}

.bus-actions {
    display: flex;
    gap: 8px;
}

.bus-actions button {
    border: none;
    padding: 9px;
    border-radius: 8px;
    cursor: pointer;
}

.edit-btn {
    background: #e8f0ff;
    color: #1d3557;
}

.delete-btn {
    background: #ffe8e8;
    color: #d62828;
}

/* EMPTY STATE */

.empty {
    text-align: center;
    padding: 40px 15px;
    color: #888;
    background: white;
    border-radius: 15px;
}

.empty h3 {
    margin-bottom: 8px;
}

/* ADD BUTTON */

.add-button {
    position: fixed;
    right: 20px;
    bottom: 100px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: #1d3557;
    color: white;
    font-size: 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    cursor: pointer;
}

/* FORM */

.form-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 100;
}

.form-box {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 25px;
    border-radius: 20px;
    max-height: 90vh;
    overflow-y: auto;
}

.form-box h2 {
    margin-bottom: 20px;
}

.form-box label {
    display: block;
    margin: 15px 0 7px;
    font-size: 14px;
    font-weight: bold;
}

.form-box input,
.form-box select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

.form-box input:focus,
.form-box select:focus {
    border-color: #1d3557;
}

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.form-buttons button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.save-btn {
    background: #1d3557;
    color: white;
}

.cancel-btn {
    background: #eee;
    color: #333;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 15px;
    box-shadow: 0 -3px 15px rgba(0,0,0,0.08);
    z-index: 50;
}

.nav-item {
    flex: 1;
    text-align: center;
    color: #888;
    font-size: 12px;
    cursor: pointer;
    padding: 5px;
}

.nav-item .icon {
    font-size: 25px;
    display: block;
    margin-bottom: 4px;
}

.nav-item.active {
    color: #1d3557;
    font-weight: bold;
}

</style>
</head>

<body>

<header>
    <h1>🚌 Bus Timing</h1>
    <p>Find your next bus easily</p>
</header>

<div class="container">

    <!-- TOWN BUTTONS -->

    <div class="section-buttons">

        <button class="section-btn active"
            onclick="selectSection('Sedapatti')">
            Sedapatti
        </button>

        <button class="section-btn"
            onclick="selectSection('Sempatty')">
            Sempatty
        </button>

        <button class="section-btn"
            onclick="selectSection('Dindigul')">
            Dindigul
        </button>

        <button class="section-btn"
            onclick="selectSection('Sithayankottai')">
            Sithayankottai
        </button>

    </div>

    <!-- HEADING -->

    <div class="time-heading">

        <h2 id="sectionTitle">Sedapatti</h2>

        <span id="displayInfo">Next 1.5 hours</span>

    </div>

    <!-- BUS LIST -->

    <div id="busList"></div>

</div>

<!-- ADD BUTTON -->

<button class="add-button" onclick="openForm()">+</button>

<!-- FORM -->

<div class="form-overlay" id="formOverlay">

    <div class="form-box">

        <h2 id="formTitle">Add Bus Timing</h2>

        <form id="busForm">

            <label>Bus Time</label>
            <input type="time" id="busTime" required>

            <label>Bus Name</label>
            <input type="text"
                id="busName"
                placeholder="Enter bus name"
                required>

            <label>Route</label>
            <input type="text"
                id="busRoute"
                placeholder="Enter route"
                required>

            <label>Town / Section</label>

            <select id="busSection" required>

                <option value="Sedapatti">Sedapatti</option>
                <option value="Sempatti">Sempatty</option>
                <option value="Dindigul">Dindigul</option>
                <option value="Sithayankottai">Sithayankottai</option>

            </select>

            <div class="form-buttons">

                <button type="button"
                    class="cancel-btn"
                    onclick="closeForm()">
                    Cancel
                </button>

                <button type="submit"
                    class="save-btn">
                    Save
                </button>

            </div>

        </form>

    </div>

</div>

<!-- BOTTOM NAVIGATION -->

<div class="bottom-nav">

    <div class="nav-item active" onclick="changeView('upcoming')">

        <span class="icon">🚌</span>

        Bus Time

    </div>

    <div class="nav-item" onclick="changeView('all')">

        <span class="icon">📋</span>

        All Buses

    </div>

</div>

<script>

/* DATA */

let buses = JSON.parse(localStorage.getItem("busData")) || [];

let selectedSection = "Sedapatti";

let currentView = "upcoming";

let editingId = null;


/* OLD SECTION DATA MIGRATION */

const oldSections = {
    "A": "Sedapatti",
    "B": "Sempatty",
    "C": "Dindigul",
    "D": "Sithayankottai"
};

buses = buses.map(bus => {

    if(oldSections[bus.section]) {

        bus.section = oldSections[bus.section];

    }

    return bus;

});

localStorage.setItem("busData", JSON.stringify(buses));


/* SELECT TOWN */

function selectSection(section) {

    selectedSection = section;

    document.querySelectorAll(".section-btn").forEach(btn => {

        btn.classList.remove("active");

        if(btn.textContent.trim() === section) {

            btn.classList.add("active");

        }

    });

    document.getElementById("sectionTitle").textContent =
        section;

    displayBuses();

}


/* CHANGE VIEW */

function changeView(view) {

    currentView = view;

    document.querySelectorAll(".nav-item").forEach(item => {

        item.classList.remove("active");

    });

    if(view === "upcoming") {

        document.querySelectorAll(".nav-item")[0]
            .classList.add("active");

        document.getElementById("displayInfo").textContent =
            "Next 1.5 hours";

    }

    if(view === "all") {

        document.querySelectorAll(".nav-item")[1]
            .classList.add("active");

        document.getElementById("displayInfo").textContent =
            "All bus timings";

    }

    displayBuses();

}


/* DISPLAY BUS TIMINGS */

function displayBuses() {

    const busList = document.getElementById("busList");

    const now = new Date();

    const currentMinutes =
        now.getHours() * 60 + now.getMinutes();

    const limitMinutes = currentMinutes + 90;


    /* FILTER TOWN */

    let filteredBuses = buses.filter(bus => {

        return bus.section === selectedSection;

    });


    /* UPCOMING BUS VIEW */

    if(currentView === "upcoming") {

        filteredBuses = filteredBuses.filter(bus => {

            const [hours, minutes] =
                bus.time.split(":").map(Number);

            const busMinutes = hours * 60 + minutes;

            return busMinutes >= currentMinutes &&
                   busMinutes <= limitMinutes;

        });

    }


    /* SORT */

    filteredBuses.sort((a, b) => {

        return a.time.localeCompare(b.time);

    });


    /* EMPTY STATE */

    if(filteredBuses.length === 0) {

        if(currentView === "upcoming") {

            busList.innerHTML = `
                <div class="empty">
                    <h3>No upcoming buses</h3>
                    <p>No buses in the next 1 hour 30 minutes.</p>
                    <p style="margin-top:10px">
                        Click All Buses to see the complete timetable.
                    </p>
                </div>
            `;

        } else {

            busList.innerHTML = `
                <div class="empty">
                    <h3>No bus timings added</h3>
                    <p>Click + to add bus timings.</p>
                </div>
            `;

        }

        return;

    }


    /* SHOW BUS CARDS */

    busList.innerHTML = filteredBuses.map(bus => {

        return `

            <div class="bus-card">

                <div class="bus-top">

                    <div>

                        <div class="bus-time">
                            ${formatTime(bus.time)}
                        </div>

                        <div class="bus-name">
                            ${escapeHTML(bus.name)}
                        </div>

                        <div class="bus-route">
                            📍 ${escapeHTML(bus.route)}
                        </div>

                        <div class="bus-route">
                            ${escapeHTML(bus.section)}
                        </div>

                    </div>

                    <div class="bus-actions">

                        <button class="edit-btn"
                            onclick="editBus(${bus.id})">
                            ✏️
                        </button>

                        <button class="delete-btn"
                            onclick="deleteBus(${bus.id})">
                            🗑️
                        </button>

                    </div>

                </div>

            </div>

        `;

    }).join("");

}


/* FORMAT TIME */

function formatTime(time) {

    let [hours, minutes] = time.split(":").map(Number);

    let period = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;

    return hours + ":" +
        String(minutes).padStart(2, "0") +
        " " + period;

}


/* OPEN FORM */

function openForm() {

    editingId = null;

    document.getElementById("formTitle").textContent =
        "Add Bus Timing";

    document.getElementById("busForm").reset();

    document.getElementById("busSection").value =
        selectedSection;

    document.getElementById("formOverlay").style.display =
        "flex";

}


/* CLOSE FORM */

function closeForm() {

    document.getElementById("formOverlay").style.display =
        "none";

}


/* SAVE BUS */

document.getElementById("busForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const bus = {

        id: editingId || Date.now(),

        time: document.getElementById("busTime").value,

        name: document.getElementById("busName").value.trim(),

        route: document.getElementById("busRoute").value.trim(),

        section: document.getElementById("busSection").value

    };


    if(editingId) {

        buses = buses.map(existingBus => {

            return existingBus.id === editingId
                ? bus
                : existingBus;

        });

    } else {

        buses.push(bus);

    }


    saveData();

    closeForm();

    displayBuses();

});


/* EDIT BUS */

function editBus(id) {

    const bus = buses.find(bus => bus.id === id);

    if(!bus) return;

    editingId = id;

    document.getElementById("formTitle").textContent =
        "Edit Bus Timing";

    document.getElementById("busTime").value =
        bus.time;

    document.getElementById("busName").value =
        bus.name;

    document.getElementById("busRoute").value =
        bus.route;

    document.getElementById("busSection").value =
        bus.section;

    document.getElementById("formOverlay").style.display =
        "flex";

}


/* DELETE BUS */

function deleteBus(id) {

    if(confirm("Are you sure you want to delete this bus timing?")) {

        buses = buses.filter(bus => bus.id !== id);

        saveData();

        displayBuses();

    }

}


/* SAVE DATA */

function saveData() {

    localStorage.setItem("busData", JSON.stringify(buses));

}


/* ESCAPE HTML */

function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, function(char) {

        return {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

        }[char];

    });

}


/* AUTOMATIC REFRESH */

setInterval(function() {

    if(currentView === "upcoming") {

        displayBuses();

    }

}, 30000);


/* INITIAL DISPLAY */

displayBuses();

</script>

</body>
</html>
